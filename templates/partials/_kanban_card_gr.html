{% for tarefa in tarefas_finalizadas %}
<div class="kanban-card" data-task-id="{{ tarefa.pk }}">
    <strong>{{ tarefa.titulo }}</strong>
    <strong>Descrição:</strong>
    {{ tarefa.descricao|truncatewords_html:10|safe }}<br>
    <small>Finalizado por: {{ tarefa.finalizado_por.username }} em {{ tarefa.data_finalizacao|date:"d/m/Y" }}</small>
</div>
{% endfor %}
