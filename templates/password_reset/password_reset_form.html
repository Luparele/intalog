{% extends 'base_public.html' %}
{% load static %}
{% block title %}Redefinir Senha{% endblock %}

{% block content %}
<div class="login-box">
    <h2>Redefinir Senha</h2>
    <p>Por favor, insira o seu endereço de e-mail. Nós lhe enviaremos as instruções para definir uma nova senha.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-principal">Enviar Link de Redefinição</button>
    </form>
</div>
{% endblock %}
